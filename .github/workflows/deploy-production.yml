name: Deploy to Production

on:
  push:
    tags:
      - "v*"

env:
  APP_LOCATION: "/"
  APP_ARTIFACT_LOCATION: "dist"
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag commit is on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - name: Build static artifact
        run: |
          SITE_NAME="${{ vars.SITE_NAME }}" \
          SITE_TITLE="${{ vars.SITE_TITLE }}" \
          SITE_DESCRIPTION="${{ vars.SITE_DESCRIPTION }}" \
          SITE_URL="${{ vars.SITE_URL }}" \
          SITE_OG_IMAGE="${{ vars.SITE_OG_IMAGE }}" \
          SITE_ROBOTS="${{ vars.SITE_ROBOTS }}" \
          npm run build
      - name: Deploy the site
        run: |
          npm install -g @azure/static-web-apps-cli
          swa deploy ./${{env.APP_ARTIFACT_LOCATION}} --deployment-token ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }} --env Production
