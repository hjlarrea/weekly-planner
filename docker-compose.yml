services:
  weekly-planner:
    build:
      context: .
      args:
        SITE_NAME: ${SITE_NAME:-Planner Semanal (Compose)}
        SITE_TITLE: ${SITE_TITLE:-Planner Semanal (Compose)}
        SITE_DESCRIPTION: ${SITE_DESCRIPTION:-Planner semanal familiar para actividades, traslados y organizacion diaria.}
        SITE_URL: ${SITE_URL:-}
        SITE_OG_IMAGE: ${SITE_OG_IMAGE:-}
        SITE_ROBOTS: ${SITE_ROBOTS:-index,follow}
        SITE_MENU_ENABLED: ${SITE_MENU_ENABLED:-true}
    environment:
      SITE_NAME: ${SITE_NAME:-Planner Semanal (Compose)}
      SITE_TITLE: ${SITE_TITLE:-Planner Semanal (Compose)}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-Planner semanal familiar para actividades, traslados y organizacion diaria.}
      SITE_URL: ${SITE_URL:-}
      SITE_OG_IMAGE: ${SITE_OG_IMAGE:-}
      SITE_ROBOTS: ${SITE_ROBOTS:-index,follow}
      SITE_MENU_ENABLED: ${SITE_MENU_ENABLED:-true}
    ports:
      - "4173:80"
    restart: unless-stopped
